<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="animeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b8b"/>
      <stop offset="100%" style="stop-color:#4dabf7"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a2be2"/>
      <stop offset="100%" style="stop-color:#ff6b8b"/>
    </linearGradient>
  </defs>
  
  <!-- Background rectangle -->
  <rect width="400" height="120" rx="15" fill="#1a1630"/>
  
  <!-- Film icon -->
  <g transform="translate(30, 30)">
    <rect x="0" y="10" width="60" height="45" rx="5" fill="url(#iconGradient)"/>
    <rect x="5" y="15" width="50" height="35" rx="3" fill="#1a1630"/>
    <circle cx="15" cy="27" r="4" fill="#1a1630"/>
    <circle cx="45" cy="27" r="4" fill="#1a1630"/>
    <rect x="10" y="55" width="10" height="15" fill="#1a1630"/>
    <rect x="30" y="55" width="10" height="15" fill="#1a1630"/>
    <rect x="20" y="55" width="10" height="15" fill="#1a1630"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="65" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="42" font-weight="700" fill="url(#animeGradient)">
    StreamPoint
  </text>
  
  <!-- Tagline -->
  <text x="100" y="95" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" fill="#b0aac0">
    Anime & Movie Streaming Portals
  </text>
</svg>

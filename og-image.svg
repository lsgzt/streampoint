<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c1d"/>
      <stop offset="50%" style="stop-color:#1a1630"/>
      <stop offset="100%" style="stop-color:#0f0c1d"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b8b"/>
      <stop offset="50%" style="stop-color:#8a2be2"/>
      <stop offset="100%" style="stop-color:#4dabf7"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b8b"/>
      <stop offset="100%" style="stop-color:#4dabf7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle radial glow -->
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="rgba(138,43,226,0.15)" stroke-width="2"/>
  <circle cx="1050" cy="480" r="60" fill="none" stroke="rgba(255,107,139,0.1)" stroke-width="2"/>
  
  <!-- Film reel icon -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#iconGradient)"/>
    <rect x="10" y="10" width="100" height="60" rx="5" fill="#1a1630"/>
    <circle cx="25" cy="40" r="8" fill="#1a1630"/>
    <circle cx="95" cy="40" r="8" fill="#1a1630"/>
    <rect x="20" y="85" width="80" height="20" rx="3" fill="#1a1630"/>
    <rect x="30" y="80" width="10" height="30" fill="#1a1630"/>
    <rect x="50" y="80" width="10" height="30" fill="#1a1630"/>
    <rect x="70" y="80" width="10" height="30" fill="#1a1630"/>
    <rect x="90" y="80" width="10" height="30" fill="#1a1630"/>
  </g>
  
  <!-- Main text -->
  <text x="180" y="320" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="80" font-weight="700" fill="url(#textGradient)">
    StreamPoint
  </text>
  
  <!-- Subtitle -->
  <text x="180" y="400" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="32" fill="#e6e6fa">
    Your Gateway to Anime & Movie Streaming
  </text>
  
  <!-- Description -->
  <text x="180" y="450" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="20" fill="#b0aac0">
    Explore thousands of titles across multiple platforms
  </text>
  
  <!-- Bottom accent -->
  <rect x="180" y="520" width="200" height="4" rx="2" fill="#8a2be2"/>
</svg>
